<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Centro de mando Zunko</title>
<meta name="theme-color" content="#1C1814">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zunko">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBF8F4;--card:#FFFFFF;--soft:#F3EDE5;--ink:#1C1814;--mute:#6F655B;--line:#E7DFD5;
  --acc:#8A5A32;--action:#E08C0B;--onaction:#1C1814;
  --ok:#1F7A45;--okbg:#E5F4EA;--warn:#9A6200;--warnbg:#FCF1DA;--bad:#C0362C;--badbg:#FBE7E4;
  --s1:#8A5A32;--s2:#C9A27A;--s3:#A8A29A;--s4:#D9822B;--s5:#1F7A45;
  --sh:0 1px 2px rgb(0 0 0/.04),0 6px 18px rgb(0 0 0/.05);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14110E;--card:#1E1A16;--soft:#29231D;--ink:#F4EEE7;--mute:#B3A799;--line:#352E27;
  --acc:#D7A877;--action:#F0A520;--ok:#5BC888;--okbg:#14301F;--warn:#F2C35B;--warnbg:#33280F;--bad:#F08377;--badbg:#3A1A16;
  --s1:#D7A877;--s2:#8C6A4A;--s3:#6E665D;--s4:#F0A520;--s5:#5BC888;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14110E;--card:#1E1A16;--soft:#29231D;--ink:#F4EEE7;--mute:#B3A799;--line:#352E27;
  --acc:#D7A877;--action:#F0A520;--ok:#5BC888;--okbg:#14301F;--warn:#F2C35B;--warnbg:#33280F;--bad:#F08377;--badbg:#3A1A16;
  --s1:#D7A877;--s2:#8C6A4A;--s3:#6E665D;--s4:#F0A520;--s5:#5BC888;color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
#app{max-width:480px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 0 12px}
.top h1{font:800 24px/1.1 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.02em;flex:1}
.brand{font:800 15px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;color:var(--mute)}
.brand b{color:var(--action)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.card h2{font:700 13px/1 "Instrument Sans",sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;align-items:end}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:13px;color:var(--mute);display:flex;align-items:center;gap:6px;justify-content:space-between}
.inp{display:flex;align-items:center;background:var(--soft);border:1px solid transparent;border-radius:12px;padding:0 12px;height:46px}
.inp:focus-within{border-color:var(--action);background:var(--card)}
.inp span{color:var(--mute);font-size:14px}
.inp input{flex:1;width:100%;border:0;background:none;outline:none;font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;padding:0 4px}
.tag{font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;background:var(--warnbg);color:var(--warn);white-space:nowrap}
.tag.real{background:var(--okbg);color:var(--ok)}
.full{grid-column:1/-1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex:1;text-align:left;background:var(--card)}
.chip small{display:block;color:var(--mute);font-size:12px}
.chip b{font-size:17px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--action);box-shadow:inset 0 0 0 1px var(--action)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 16px;border-radius:12px;font-weight:600;background:var(--action);color:var(--onaction)}
.btn.sec{background:var(--soft);color:var(--ink)}
.row{display:flex;gap:10px;align-items:flex-end}
.row .f{flex:1}
.be{border-radius:18px;padding:18px 16px;margin-bottom:12px}
.be.verde{background:var(--okbg);color:var(--ok)}.be.ambar{background:var(--warnbg);color:var(--warn)}.be.rojo{background:var(--badbg);color:var(--bad)}
.be small{display:block;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.be strong{display:block;font:800 44px/1.05 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:4px 0}
.be p{font-size:14px;color:var(--ink)}
.bar{position:relative;display:flex;height:22px;border-radius:8px;overflow:hidden;background:var(--soft);margin:4px 0 12px}
.bar i{display:block;height:100%}
.bar .cien{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.leg{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.leg li{display:flex;align-items:center;gap:8px;font-size:15px}
.leg li .d{width:10px;height:10px;border-radius:3px;flex:none}
.leg li span:nth-child(2){flex:1}
.leg li b{font-variant-numeric:tabular-nums}
.leg li em{font-style:normal;color:var(--mute);font-size:13px;width:44px;text-align:right;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:15px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.note{font-size:13px;color:var(--mute);margin-top:10px}
.alerta{background:var(--badbg);color:var(--bad);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.alerta.ok{background:var(--okbg);color:var(--ok)}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mute);padding:6px 0;border-radius:10px}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
.tabs button[aria-current="page"] svg{color:var(--action)}
.vacio{text-align:center;color:var(--mute);padding:40px 12px}
.vacio h2{font:800 20px "Bricolage Grotesque",sans-serif;color:var(--ink);margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* ---- piezas comunes ---- */
.ib{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border-radius:10px;color:var(--mute);flex:none}
.ib:hover{background:var(--soft);color:var(--ink)}
.lnk{color:var(--acc);font-weight:600;text-decoration:underline;text-underline-offset:2px}
.lnk.peligro,.peligro.lnk{color:var(--bad)}
.btn.peligro{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.mute{color:var(--mute);font-weight:400}
textarea{width:100%;border:1px solid transparent;background:var(--soft);border-radius:12px;padding:10px 12px;resize:vertical;outline:none}
textarea:focus{border-color:var(--action);background:var(--card)}
.inp select{flex:1;border:0;background:none;outline:none;height:100%;font-weight:600}
.inp input[type=date],.inp input[type=datetime-local],.inp input[type=url],.inp input[type=text],.inp input[type=number]{font-size:15px}
.empty{color:var(--mute);font-size:15px;padding:6px 0}
.empty.small{font-size:14px}
.sub{font-size:14px;font-weight:600;margin:16px 0 6px;display:flex;gap:8px;align-items:baseline}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.acts .btn{flex:1}
.addrow{display:flex;align-items:center;gap:6px;color:var(--acc);font-weight:600;padding:10px 0}
.addp{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.addp .grow{flex:1 1 200px}
.addp .btn{width:46px;padding:0}
.lrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow>span:not(.dot):not(.hk){flex:1}
.lrow b{font-weight:600;display:block;overflow-wrap:anywhere}
.lrow b a{color:inherit;display:inline-flex;align-items:center;gap:4px}
.lrow small{display:block;color:var(--mute);font-size:13px}
.hk{width:24px;height:24px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex:none}
.prow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.prow input[type=checkbox]{width:20px;height:20px;margin-top:2px;accent-color:var(--action);flex:none}
.prow>span{flex:1}.prow b{font-weight:600;display:block}.prow small{color:var(--mute);font-size:13px}
.prow.hecho b{text-decoration:line-through;color:var(--mute)}
.hechos{margin-top:12px;color:var(--mute);font-size:14px}.hechos summary{cursor:pointer}
.check{display:flex;align-items:center;gap:8px;font-size:15px;height:46px}
.check input{width:20px;height:20px;accent-color:var(--action)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.dot.verde{background:var(--ok)}.dot.ambar{background:var(--action)}.dot.rojo{background:var(--bad)}
.aviso{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.aviso.ok{background:var(--okbg);color:var(--ok)}
.etapas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.etapa{background:var(--soft);border-radius:12px;padding:12px 6px;text-align:center}
.etapa b{display:block;font:800 26px "Bricolage Grotesque",sans-serif}.etapa span{font-size:13px;color:var(--mute)}
.decs{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px;font-size:14px}
.decs small{display:block;color:var(--mute);font-size:12px}
/* ---- tablero ---- */
.top .btn{height:40px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,82%);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin:0 -16px;padding-left:16px;padding-right:16px}
.colk{scroll-snap-align:start;background:var(--soft);border-radius:16px;padding:12px;min-height:200px;border:2px dashed transparent}
.colk.sobre{border-color:var(--action)}
.colk h2{font-size:14px;font-weight:600;margin:2px 4px 10px;display:flex;justify-content:space-between}
.colk h2 span{color:var(--mute)}
.colk.descartado{opacity:.75}
.tk{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;box-shadow:var(--sh)}
.tk:hover{border-color:var(--acc)}
.tk.drag{opacity:.4}
.tk-h{display:flex;align-items:center;gap:8px}.tk-h b{font-weight:600}
.tk-m{font-size:13px;color:var(--mute)}.tk-m b{color:var(--ink)}
/* ---- ficha ---- */
.editable{flex:1}
.editable input{width:100%;border:0;background:none;font:inherit;letter-spacing:inherit;outline:none;border-bottom:2px solid transparent}
.editable input:focus{border-bottom-color:var(--action)}
.stepper{display:flex;gap:4px;margin-bottom:14px}
.stepper button{flex:1;font-size:13px;font-weight:600;padding:8px 4px;border-radius:10px;background:var(--soft);color:var(--mute)}
.stepper button.done{color:var(--ink)}
.stepper button.on{background:var(--ink);color:var(--bg)}
/* ---- diálogo ---- */
dialog{border:0;border-radius:18px;padding:20px;width:min(440px,calc(100vw - 32px));background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgb(0 0 0/.3)}
dialog::backdrop{background:rgb(0 0 0/.4)}
dialog h2{font:800 20px "Bricolage Grotesque",sans-serif;margin-bottom:12px}
.dlg-act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
@media (min-width:900px){
  body.ancho #app{max-width:1500px}
  .board{grid-auto-flow:row;grid-template-columns:repeat(5,minmax(0,1fr));overflow:visible;margin:0;padding:0}
  .resumen{position:static}
}
/* ---- pauta ---- */
.als{display:grid;gap:8px;margin:12px 0}
.al{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:10px 12px;font-size:14px;background:var(--soft)}
.al p{margin:0}
.al .al-i{width:20px;height:20px;border-radius:50%;flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--mute);color:var(--card);margin-top:1px}
.al.mal{background:var(--badbg);color:var(--bad)}.al.mal .al-i{background:var(--bad)}
.al.aviso{background:var(--warnbg);color:var(--warn)}.al.aviso .al-i{background:var(--warn)}
.al.bien{background:var(--okbg);color:var(--ok)}.al.bien .al-i{background:var(--ok)}
.al .lnk{color:inherit}
.btn.chico{height:34px;font-size:14px;margin-top:8px;padding:0 12px}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
.tb{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tb th{text-align:right;font-size:12px;font-weight:600;color:var(--mute);padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb th:first-child,.tb td:first-child{text-align:left;white-space:normal;min-width:120px}
.tb tr.off td{color:var(--mute)}.tb tr.off td:first-child{text-decoration:line-through}
.tb tr.tot td{font-weight:600;border-bottom:0}
.tb.reg input{width:100%;min-width:72px;text-align:right;border:1px solid transparent;background:var(--soft);border-radius:8px;padding:8px;font-weight:600;outline:none}
.tb.reg input:focus{border-color:var(--action);background:var(--card)}
/* ---- crear ---- */
.seg2{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg2 button{padding:7px 14px;border-radius:9px;font-size:14px;font-weight:600;color:var(--mute)}
.seg2 button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.foto{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.foto img{width:72px;height:72px;object-fit:cover;border-radius:10px;background:var(--soft);flex:none}
.foto-d{flex:1;display:grid;gap:6px}.foto-d .inp{height:40px}
.foto-c{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mute)}
.foto-c label{display:flex;align-items:center;gap:4px}.foto-c input{accent-color:var(--action)}
.foto-a{display:flex;flex-direction:column}.foto-a .ib{width:32px;height:30px}
.ib:disabled{opacity:.3}
.faq-e{display:grid;grid-template-columns:1fr auto;gap:6px 6px;padding:10px 0;border-bottom:1px solid var(--line)}
.faq-e textarea{grid-column:1}.faq-e .ib{grid-row:1/3;grid-column:2}
.prev{background:var(--soft);border-radius:14px;padding:10px;display:flex;justify-content:center}
.prev iframe{border:0;background:#fff;border-radius:10px;height:720px;width:100%}
.prev.cel iframe{width:390px;max-width:100%}
label.btn input[type=file]{display:none}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
.cols{display:block}
.tabs .logo{display:none}
/* Computador (Windows): barra lateral y la calculadora en dos columnas */
@media (min-width:900px){
  body{padding-left:220px}
  #app{max-width:1180px;padding:0 32px 40px}
  .top{padding-top:24px}
  .top h1{font-size:30px}
  .top .brand{display:none}
  .tabs{top:0;right:auto;width:220px;border-top:0;border-right:1px solid var(--line);padding:20px 12px}
  .tabs div{display:flex;flex-direction:column;gap:4px;max-width:none}
  .tabs .logo{display:block;font:800 26px "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;padding:0 12px 18px}
  .tabs .logo b{color:var(--action)}
  .tabs button{flex-direction:row;gap:12px;font-size:15px;padding:10px 12px;justify-content:flex-start}
  .tabs button:hover{background:var(--soft)}
  .tabs button[aria-current="page"]{background:var(--soft)}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
  .cols.fija>.out{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow:auto;padding-right:4px}
  .grid{grid-template-columns:1fr 1fr}
  .toast{bottom:24px;left:calc(50% + 110px)}
}
@media (min-width:1280px){.cols{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" aria-label="Secciones"><div id="tabs"></div></nav>
<div class="toast" id="toast" role="status"></div>
<dialog id="dlg"></dialog>
<script src="calc.js"></script>
<script src="pauta.js"></script>
<script src="landing.js"></script>
<script src="fotos.js"></script>
<script src="crear.js"></script>
<script src="app.js"></script>
</body>
</html>
